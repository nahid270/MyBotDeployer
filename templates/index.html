<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Bot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { 
            background: radial-gradient(circle at center, #151525 0%, #08080f 100%); 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height: 100vh;
        }
        .glass-card { 
            background: rgba(31, 31, 47, 0.45); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
        }
        .card { 
            background: rgba(31, 31, 47, 0.45); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 12px; 
            backdrop-filter: blur(12px); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); 
        }
        .card-header {
            background-color: rgba(0, 0, 0, 0.2) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .form-control, .form-select { 
            background-color: rgba(43, 43, 67, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            border-radius: 8px; 
            backdrop-filter: blur(5px); 
        }
        .form-control:focus, .form-select:focus { 
            background-color: rgba(43, 43, 67, 0.8); 
            color: white; 
            border-color: #0d6efd; 
            box-shadow: 0 0 10px rgba(13, 110, 253, 0.5); 
        }
        .table { color: #d0d0e0; }
        .table-hover tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        .btn-web { background-color: #0d6efd; color: white; }
        .btn-web:hover { background-color: #0b5ed7; color: white; }
        .modal-content { 
            background: rgba(25, 25, 35, 0.95); 
            backdrop-filter: blur(15px); 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 12px;
        }
        .modal-header { border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .modal-footer { border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .status-running { color: #00ff88; font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        .status-stopped { color: #ff4d4d; font-weight: bold; text-shadow: 0 0 10px rgba(255, 77, 77, 0.3); }
        .status-loading { color: #ffcc00; font-weight: bold; text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
        .stats-badge { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 4px 8px; 
            border-radius: 6px; 
            font-size: 0.8rem; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            display: inline-block;
        }
        pre#log-viewer { 
            background: #05050a; 
            color: #00ff66; 
            padding: 12px; 
            height: 380px; 
            overflow-y: auto; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.85rem; 
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4 text-uppercase fw-bold text-white" style="letter-spacing: 2px; text-shadow: 0 0 15px rgba(13, 110, 253, 0.4);">🤖 Ultimate Bot Manager</h1>

    <!-- Koyeb Server Resource Monitor -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card glass-card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <h5 class="m-0 text-uppercase fw-bold text-info" style="letter-spacing: 1px;">⚡ System Resource Status</h5>
                        <small class="text-secondary">Overall container footprint on Koyeb (Max: 512 MB)</small>
                    </div>
                    <div class="text-end">
                        <span id="sys-ram-badge" class="badge bg-dark border border-info text-info font-monospace py-2 px-3">Calculating...</span>
                    </div>
                </div>
                <div class="progress" style="height: 10px; background-color: #2b2b2b; border-radius: 5px;">
                    <div id="sys-ram-progress" class="progress-bar progress-bar-striped progress-bar-animated bg-info" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Deploy Section -->
    <div class="card mb-5">
        <div class="card-header text-info fw-bold">Deploy New Instance</div>
        <div class="card-body">
            <form action="/deploy" method="POST">
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label class="form-label text-secondary small">GitHub Repository</label>
                        <input type="text" name="repo_link" class="form-control" placeholder="https://github.com/username/repo" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label text-secondary small">Start File (Optional)</label>
                        <input type="text" name="start_file" class="form-control" placeholder="e.g. main.py">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label text-secondary small">Port (Optional)</label>
                        <input type="number" name="custom_port" class="form-control" placeholder="e.g. 5000">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label text-secondary small">Max RAM Limit (MB)</label>
                        <input type="number" name="max_ram" class="form-control" placeholder="e.g. 80" value="80" min="30" max="250">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-secondary small">Environment Variables / Config (KEY=VALUE)</label>
                    <textarea name="env_vars" class="form-control font-monospace" rows="3" placeholder="BOT_TOKEN=123:ABC..."></textarea>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 border-0" style="background: linear-gradient(90deg, #198754 0%, #157347 100%);">⚡ INITIATE DEPLOYMENT</button>
            </form>
        </div>
    </div>

    <!-- Active List -->
    <h4 class="mb-3 border-bottom pb-2">Active Instances</h4>
    <div class="table-responsive">
        <table class="table table-dark table-hover rounded overflow-hidden align-middle">
            <thead class="bg-secondary">
                <tr>
                    <th>Name / Port</th>
                    <th>Resources</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="bot-table-body">
                <tr><td colspan="4" class="text-center p-4">Loading system status...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Config Modal -->
<div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">⚙️ Edit Configuration</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-bot-name">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Max RAM Limit (MB)</label>
                    <input type="number" id="edit-max-ram" class="form-control" placeholder="e.g. 80" min="30" max="250">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary small">Environment Variables</label>
                    <textarea id="edit-env-vars" class="form-control font-monospace" rows="6"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="saveConfig()">Save & Apply</button>
            </div>
        </div>
    </div>
</div>

<!-- Logs Modal -->
<div class="modal fade" id="logsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark">
                <h5 class="modal-title text-info">📝 Live Logs - <span id="log-bot-name"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-2">
                <pre id="log-viewer">Loading logs...</pre>
            </div>
            <div class="modal-footer p-1 bg-dark">
                <button type="button" class="btn btn-sm btn-secondary" onclick="refreshLogs()">🔄 Refresh</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentLogBot = "";
    let logInterval = null;

    // Copy bot link function
    function copyWebLink(botName) {
        let fullUrl = window.location.origin + "/view/" + botName + "/";
        navigator.clipboard.writeText(fullUrl).then(() => {
            alert("✅ Link Copied Successfully!\n\nUse this link in your bot's Stream URL, FQDN or Web URL:\n\n" + fullUrl);
        }).catch(err => {
            alert("❌ Copy failed: " + err);
        });
    }

    function updateStatus() {
        $.getJSON('/status', function(data) {
            let rows = '';
            if(data.length === 0) {
                rows = '<tr><td colspan="4" class="text-center text-secondary p-4">No bots deployed. Start one above!</td></tr>';
            } else {
                $.each(data, function(key, bot) {
                    let statusClass = "status-loading";
                    if(bot.status.includes("Running")) statusClass = "status-running";
                    if(bot.status.includes("Stopped") || bot.status.includes("Crashed")) statusClass = "status-stopped";

                    let mainBtn = bot.running 
                        ? `<a href="/stop/${bot.name}" class="btn btn-warning btn-sm fw-bold">🛑 Stop</a>`
                        : `<a href="/start/${bot.name}" class="btn btn-success btn-sm fw-bold">▶️ Start</a>`;
                    
                    let webBtn = bot.running
                        ? `<a href="/view/${bot.name}/" target="_blank" class="btn btn-web btn-sm fw-bold ms-1" title="Open Web Interface">🌐 Web</a>`
                        : `<button class="btn btn-secondary btn-sm fw-bold ms-1" disabled title="Bot is stopped">🌐 Web</button>`;

                    let copyBtn = `<button class="btn btn-outline-info btn-sm ms-1 fw-bold border" onclick="copyWebLink('${bot.name}')" title="Copy Shareable Public Link">🔗 Copy Link</button>`;
                    
                    rows += `
                    <tr>
                        <td>
                            <div class="fw-bold text-white">${bot.name}</div>
                            <div class="text-info font-monospace small">Port: ${bot.port}</div>
                        </td>
                        <td>
                            <span class="stats-badge text-warning">💾 RAM: ${bot.ram} / ${bot.max_ram} MB</span><br>
                            <span class="stats-badge text-info mt-1 d-inline-block">⚡ CPU: ${bot.cpu}%</span>
                        </td>
                        <td class="${statusClass} small">${bot.status}</td>
                        <td>
                            ${mainBtn}
                            ${webBtn}
                            ${copyBtn}
                            <a href="/update/${bot.name}" class="btn btn-primary btn-sm fw-bold ms-1" title="Pull Latest Code & Restart">🔄 Update</a>
                            <button class="btn btn-dark btn-sm ms-1 border" onclick="openLogs('${bot.name}')">📝 Logs</button>
                            <button class="btn btn-info btn-sm ms-1 fw-bold" onclick="openConfig('${bot.name}')">⚙️</button>
                            <a href="/delete/${bot.name}" class="btn btn-danger btn-sm ms-2">🗑️</a>
                        </td>
                    </tr>`;
                });
            }
            $('#bot-table-body').html(rows);
        });
    }

    function updateSystemHealth() {
        $.getJSON('/system_usage', function(data) {
            if (data.error) return;
            $('#sys-ram-badge').text(data.used_ram + ' / ' + data.total_ram + ' MB (' + data.percent + '%)');
            $('#sys-ram-progress').css('width', data.percent + '%');
            
            // থ্রেশহোল্ড অনুযায়ী রঙ পরিবর্তন
            if (data.percent > 85) {
                $('#sys-ram-progress').removeClass('bg-info bg-warning').addClass('bg-danger');
                $('#sys-ram-badge').removeClass('border-info text-info border-warning text-warning').addClass('border-danger text-danger');
            } else if (data.percent > 65) {
                $('#sys-ram-progress').removeClass('bg-info bg-danger').addClass('bg-warning');
                $('#sys-ram-badge').removeClass('border-info text-info border-danger text-danger').addClass('border-warning text-warning');
            } else {
                $('#sys-ram-progress').removeClass('bg-warning bg-danger').addClass('bg-info');
                $('#sys-ram-badge').removeClass('border-warning border-danger text-warning text-danger').addClass('border-info text-info');
            }
        });
    }

    function openConfig(botName) {
        $('#edit-bot-name').val(botName);
        $.getJSON('/get_config/' + botName, function(data) {
            $('#edit-env-vars').val(data.env);
            $('#edit-max-ram').val(data.max_ram);
            new bootstrap.Modal(document.getElementById('configModal')).show();
        });
    }

    function saveConfig() {
        let botName = $('#edit-bot-name').val();
        let envData = $('#edit-env-vars').val();
        let maxRam = $('#edit-max-ram').val();
        $.post('/update_config/' + botName, { env_vars: envData, max_ram: maxRam }, function(resp) {
            alert("✅ Config Saved! Please click 'Update' or restart the bot to apply changes.");
            bootstrap.Modal.getInstance(document.getElementById('configModal')).hide();
        });
    }

    function openLogs(botName) {
        currentLogBot = botName;
        $('#log-bot-name').text(botName);
        $('#log-viewer').text("Loading logs...");
        new bootstrap.Modal(document.getElementById('logsModal')).show();
        refreshLogs();
        
        // পুরাতন রানিং ইন্টারভাল বন্ধ করে ফ্রেশ ইন্টারভাল চালু
        if (logInterval) clearInterval(logInterval);
        logInterval = setInterval(refreshLogs, 2000);
    }

    function refreshLogs() {
        if (!currentLogBot) return;
        $.get('/logs/' + currentLogBot, function(data) {
            let viewer = $('#log-viewer');
            viewer.text(data);
            viewer.scrollTop(viewer[0].scrollHeight); // অটো স্ক্রোল ডাউন
        });
    }

    // মোডাল বন্ধ হলে লগের রিকোয়েস্ট পোলিং বন্ধ করার জন্য ইভেন্ট হ্যান্ডলার
    $('#logsModal').on('hidden.bs.modal', function () {
        if (logInterval) {
            clearInterval(logInterval);
            logInterval = null;
        }
        currentLogBot = "";
    });

    // পিরিয়ডিক ইন্টারভাল
    setInterval(updateStatus, 3000);
    setInterval(updateSystemHealth, 5000); // প্রতি ৫ সেকেন্ডে কয়্যেব টোটাল রিসোর্স রিলোড
    
    // ইনিশিয়াল লোড
    updateStatus();
    updateSystemHealth();
</script>

</body>
</html>
